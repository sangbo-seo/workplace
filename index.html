<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>테스트 페이지</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --fg: #1f2328;
      --muted: #656d76;
      --card: #ffffff;
      --border: #d8dee4;
      --accent: #0969da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #8d96a0;
        --card: #161b22;
        --border: #30363d;
        --accent: #4493f8;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 48px 16px;
    }
    h1 { margin: 0 0 4px; font-size: 1.75rem; }
    .sub { color: var(--muted); margin: 0 0 32px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .card h2 { margin: 0 0 12px; font-size: 1.1rem; }
    button {
      font: inherit;
      padding: 8px 16px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    .count { font-size: 2rem; font-weight: 600; margin-left: 16px; vertical-align: middle; }
    input {
      font: inherit;
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--fg);
    }
    #greeting { margin: 12px 0 0; min-height: 1.6em; }
    footer { color: var(--muted); font-size: 0.875rem; margin-top: 32px; }
  </style>
</head>
<body>
  <main>
    <h1>테스트 웹페이지</h1>
    <p class="sub">간단한 동작 확인용 페이지입니다.</p>

    <section class="card">
      <h2>카운터</h2>
      <button id="inc" type="button">+1</button>
      <span class="count" id="count">0</span>
    </section>

    <section class="card">
      <h2>인사하기</h2>
      <input id="name" type="text" placeholder="이름을 입력하세요" autocomplete="off">
      <p id="greeting"></p>
    </section>

    <section class="card">
      <h2>현재 시각</h2>
      <p id="clock" style="margin:0"></p>
    </section>

    <footer>workplace · test page</footer>
  </main>

  <script>
    let count = 0;
    const countEl = document.getElementById('count');
    document.getElementById('inc').addEventListener('click', () => {
      countEl.textContent = ++count;
    });

    const greeting = document.getElementById('greeting');
    document.getElementById('name').addEventListener('input', (e) => {
      const name = e.target.value.trim();
      greeting.textContent = name ? `안녕하세요, ${name}님!` : '';
    });

    const clock = document.getElementById('clock');
    const tick = () => { clock.textContent = new Date().toLocaleString('ko-KR'); };
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
